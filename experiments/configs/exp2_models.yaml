# -----------------------------------------------------------------------------
# Experiment 2 — Model Family Comparison (all via OpenRouter)
# -----------------------------------------------------------------------------
# OpenRouter uses one API key and OpenAI-compatible base URL; model ids are
# provider-prefixed slugs (e.g. openai/gpt-4o, meta-llama/llama-3-8b-instruct).
# Set OPENROUTER_API_KEY in .env and use provider: openrouter for every player.
# -----------------------------------------------------------------------------

experiment_name: "Model Comparison"
strategy: cot
temperature: 0.3

games:
  - tictactoe
  - prisoners_dilemma
  - kuhn_poker

rounds_per_matchup: 15

matchups:
  - player_a_model: openai/gpt-4o
    player_a_provider: openrouter
    player_b_model: openai/gpt-3.5-turbo
    player_b_provider: openrouter

  - player_a_model: openai/gpt-4o
    player_a_provider: openrouter
    player_b_model: meta-llama/llama-3-8b-instruct
    player_b_provider: openrouter

  - player_a_model: openai/gpt-3.5-turbo
    player_a_provider: openrouter
    player_b_model: meta-llama/llama-3-8b-instruct
    player_b_provider: openrouter

output_formats:
  - json
  - csv
  - html

include_llm_summary: true
